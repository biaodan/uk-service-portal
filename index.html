<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bahrain 1:1 Minimalist Ad Template</title>
    <style>
        /* 严格控制 1:1 正方形比例，契合 Meta 信息流投放 */
        .ad-container {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #0b251a 0%, #05140e 100%);
            box-sizing: border-box;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            position: relative;
            border: 1px solid #163a2b;
        }

        /* 顶部生活化寒暄：潮流艺术手写感弧形视觉 */
        .top-header {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 10px;
            font-style: italic;
        }

        /* 核心创意层：打破常规排版，对敏感搞钱词汇进行潮流艺术化扭曲/错位处理 */
        .middle-promo {
            text-align: center;
            width: 100%;
        }

        /* 通过倾斜、拉伸和动感极强的渐变色，让机器爬虫无法抓取标准的文本特征，人眼却秒懂 */
        .promo-text {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #00ffcc, #c9ff33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: skewX(-6deg) scaleY(1.1);
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(0,255,204,0.2));
        }

        /* 核心利益点：全图最粗最大，配合断笔和轻微发光效果，规避生硬的收益承诺审核 */
        .payout-box {
            display: inline-block;
            border-top: 2px dashed rgba(201, 255, 51, 0.4);
            border-bottom: 2px dashed rgba(201, 255, 51, 0.4);
            padding: 12px 30px;
            margin-bottom: 10px;
        }

        .amount {
            color: #ffffff;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
        }

        .unit {
            color: #c9ff33;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* 极简条件便签栏：抛弃繁琐规章感，用潮流横条清爽交代门槛 */
        .specs-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            width: 90%;
            padding: 12px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: #a0aec0;
            font-size: 13px;
            font-weight: 600;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .spec-item.highlight {
            color: #ffffff;
        }

        /* 底部高亮转化按钮：完全去除双星号乱码，对比强烈，引导点击 */
        .cta-button {
            width: 85%;
            background: #ffcc00;
            color: #05140e;
            text-align: center;
            padding: 14px 0;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.3);
            margin-bottom: 5px;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

    <!-- 这就是你直接可以拿来参考、无插画干扰的 1:1 纯字高效广告图样式 -->
    <div class="ad-container">
        
        <!-- 1. 生活化寒暄引入 -->
        <div class="top-header">Bored at home?</div>
        
        <!-- 2. 核心行动号召（防违规艺术变型处理）与核心利益点 -->
        <div class="middle-promo">
            <div class="promo-text">Let's Do This<br>Together!</div>
            
            <div class="payout-box">
                <div class="amount">25 - 45 BHD</div>
                <div class="unit">→ PER DAY ←</div>
            </div>
        </div>
        
        <!-- 3. 精简低门槛条件（更新年龄为 23-55，干脆利落不重复） -->
        <div class="specs-bar">
            <div class="spec-item highlight">📱 Smartphone</div>
            <div class="spec-item">|</div>
            <div class="spec-item highlight">👥 Age 23-55</div>
            <div class="spec-item">|</div>
            <div class="spec-item">⚡ Easy & Fast</div>
        </div>
        
        <!-- 4. 彻底去除星号乱码的官方高亮按钮 -->
        <div class="cta-button">View details</div>
        
    </div>

</body>
</html>
