<!-- Project: UK Recruitment/Service - Advisor Allocation - English Version -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisor Assigned</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #ffffff; 
        }
        .card { 
            text-align: center; 
            width: 90%; 
            max-width: 360px; 
            padding: 25px; 
            box-sizing: border-box; 
        }
        
        /* Professional green accent icon */
        .top-icon { 
            width: 70px; 
            height: 70px; 
            background: #E8F5E9; 
            color: #2E7D32; 
            font-size: 35px; 
            line-height: 70px; 
            border-radius: 50%; 
            margin: 0 auto 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .title { 
            font-size: 22px; 
            font-weight: bold; 
            color: #1a1a1a; 
            margin-bottom: 20px; 
        }
        
        .desc { 
            font-size: 16px; 
            color: #444; 
            line-height: 1.8; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        
        /* High-conversion WhatsApp Style Button */
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 18px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 19px; 
            box-shadow: 0 4px 15px rgba(37,211,102,0.3); 
            transition: transform 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        .btn:before { 
            content: '💬'; 
            margin-right: 10px; 
            font-size: 20px; 
        }
        
        /* Note to encourage multiple clicks if needed */
        .busy-note { 
            font-size: 13px; 
            color: #d32f2f; 
            margin-top: 30px; 
            background: #fff5f5; 
            padding: 12px; 
            border-radius: 10px; 
            line-height: 1.6; 
            border: 1px dashed #feb2b2;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-icon">👋</div>

        <!-- Headline: Are you still hesitating? -->
        <div class="title">Are you still hesitating?</div>
        
        <!-- Body: Conversational English -->
        <div class="desc">
            That's not a problem at all... You can contact us via <br>
            <b>WhatsApp</b> to get more details. <br><br>
            This could be a great opportunity for your future.
        </div>
        
        <!-- Updated Redirection Link -->
        <a href="https://svip1027.top/18" class="btn">CONTACT US NOW</a>
        
        <!-- Bottom Hint -->
        <div class="busy-note">
            ⚠️ <b>We are currently experiencing high volume!</b> <br>
            If the redirection fails, please click the button 2-3 times.
        </div>
    </div>
</body>
</html>
